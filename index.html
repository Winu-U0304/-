if(same&&dist<14&&gh.groan<=0){gh.groan=6+rnd()*5;tn(100+rnd()*30,1.1,'sawtooth',.06+.08*(1-dist/14),55);cap('うめき声');if(!hasSeenGhost&&dist<12){hasSeenGhost=true;say('あれは…昔、いじめをしていた生徒の霊だ…',4200)}}
if(same&&dist<DF.kd&&Math.abs(LV[P.l].base+1-g.position.y)<2)die(gh)}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;
if(state==='title'||state==='menu'||state==='story'){titleCam(now/1000);R.render(S,cam);return}

if(mv){const len=Math.hypot(mx,mz);mx/=len;mz/=len;const sp=run?5:2.9,c=Math.cos(P.yaw),s=Math.sin(P.yaw),vx=(mx*c+mz*s)*sp*dt,vz=(-mx*s+mz*c)*sp*dt;if(!hit(P.l,P.x+vx,P.z))P.x+=vx;if(!hit(P.l,P.x,P.z+vz))P.z+=vz;P.bob+=dt*(run?11:7);stepT-=dt;if(stepT<=0){stepT=run?.32:.52;nz(.07,220,'lowpass',.12);if(run)noise=Math.max(noise,.9)}}

{const L=LV[P.l],arr=L.lamps.map(q=>[q,(q.x-P.x)**2+(q.z-P.z)**2]).sort((a,b)=>a[1]-b[1]);for(let i=0;i<PL.length;i++){const e=arr[i];if(e&&e[1]<900){PL[i].position.set(e[0].x,L.base+e[0].y,e[0].z);PL[i].intensity=(.55+.25*Math.sin(time*(3+i))+(rnd()<.03?-.4:0))*CFG.bright}else PL[i].intensity=0}}
spot.intensity=flOn?(rnd()<.01?.4:2.6*CFG.fl):0;

gunM.position.set(.22,-.2+(reloadT>0?-.12:0),-.42+kick*.07);gunM.rotation.x=kick*.2+(reloadT>0?.6:0);muzzle.intensity=flashT>0?4:0;knifeM.position.set(.26+Math.sin(knifeT*9)*-.2,-.22,-.42-Math.sin(knifeT*9)*.2);knifeM.rotation.set(0,0,knifeT>0?-.8:-.2);

updDoors(dt);ghosts.forEach(gh=>updGhost(gh,dt));
if(friendFree){const fx=P.x+Math.sin(P.yaw)*1.8,fz=P.z+Math.cos(P.yaw)*1.8,dx=fx-friend.position.x,dz=fz-friend.position.z,d=Math.hypot(dx,dz);if(d>.4){const sp=Math.min(d*2.2,4.2)*dt,nx=friend.position.x+dx/d*sp,nz2=friend.position.z+dz/d*sp;if(!solidAt(friendL,nx,nz2)){friend.position.x=nx;friend.position.z=nz2}else if(!solidAt(friendL,nx,friend.position.z))friend.position.x=nx;else if(!solidAt(friendL,friend.position.x,nz2))friend.position.z=nz2}friend.position.y=LV[friendL].base;friend.rotation.y=Math.atan2(P.x-friend.position.x,P.z-friend.position.z)}
else{cryT-=dt;if(cryT<=0){cryT=9+rnd()*5;const d=Math.hypot(P.x-friend.position.x,P.z-friend.position.z)+(P.l===1?0:14);tn(520,.9,'sine',Math.max(.01,.12*(1-d/90)),380);cap('友達の泣き声',2000);if(d<60)say('……かすかに、友達の声が聞こえる。',2400)}}
