<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
              :root {
    --bg-color: #0b0f19;
    --card-bg: #131a2c;
    --text-main: #e2e8f0;
    --text-muted: #4a5568;
    --color-correct: #00f5d4;
    --color-wrong: #ff007f;
    --color-primary: #00b4d8;
}

body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    background-color: var(--bg-color);
    background-image: radial-gradient(circle at 50% 50%, #1a233a 0%, #0b0f19 100%);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    user-select: none;
    overflow: hidden;
}

.container {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(0, 180, 216, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(0, 180, 216, 0.2);
    text-align: center;
    width: 100%;
    max-width: 650px;
    margin-bottom: 20px;
}

h1 {
    margin-bottom: 10px;
    font-size: 2.2rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(0, 180, 216, 0.6), 0 0 20px rgba(0, 180, 216, 0.3);
}

.score-board {
    display: flex;
    justify-content: space-around;
    margin-bottom: 25px;
    font-size: 1.2rem;
    font-weight: bold;
    background: #090d16;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    color: #00b4d8;
    text-shadow: 0 0 5px rgba(0, 180, 216, 0.5);
}

.kanji-display {
    font-size: 2.8rem;
    letter-spacing: 1px;
    margin-bottom: 5px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
}

.kana-display {
    font-size: 1.2rem;
    color: #94a3b8;
    margin-bottom: 20px;
    height: 1.5rem;
}

.typing-area {
    font-size: 2.6rem;
    font-family: 'Consolas', 'Courier New', monospace;
    letter-spacing: 3px;
    height: 70px;
    border-bottom: 2px solid #1e293b;
    margin-bottom: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.correct {
    color: var(--color-correct);
    text-shadow: 0 0 8px rgba(0, 245, 212, 0.6), 0 0 15px rgba(0, 245, 212, 0.3);
}

.current {
    color: var(--text-main);
    background-color: rgba(0, 180, 216, 0.15);
    border-bottom: 3px solid var(--color-primary);
    text-shadow: 0 0 5px #fff;
    box-shadow: 0 0 10px rgba(0, 180, 216, 0.3);
}

.wrong-flash {
    animation: shake 0.1s linear 2;
    background-color: rgba(255, 0, 127, 0.2) !important;
    border: 1px solid var(--color-wrong);
    box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
}

@keyframes shake {
    0% { transform: translateX(0); }
    50% { transform: translateX(-6px); }
    100% { transform: translateX(6px); }
}

.btn {
    background-color: var(--color-primary);
    color: white;
    border: none;
    padding: 14px 40px;
    font-size: 1.3rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
    box-shadow: 0 0 10px rgba(0, 180, 216, 0.3);
}

.btn:hover {
    background-color: #0096b1;
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(0, 180, 216, 0.6);
}

.result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 25px 0;
    font-size: 1.2rem;
    text-align: left;
    background: #090d16;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.result-item {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #1e293b;
    padding: 8px 0;
}

.hidden { display: none !important; }

.name-inputs { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
.name-inputs input { padding: 8px 12px; font-size: 1rem; background: #090d16; color: #fff; border: 2px solid #1e293b; border-radius: 6px; width: 140px; text-align: center; }
.name-inputs input:focus { border-color: var(--color-primary); box-shadow: 0 0 10px rgba(0, 180, 216, 0.4); outline: none; }
.mode-selection { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
.btn-secondary { background-color: #7b2cbf; }
.btn-secondary:hover { background-color: #6a1b9a; box-shadow: 0 0 20px rgba(123, 44, 191, 0.6); }
.btn-home { background-color: #334155; box-shadow: none; }
.btn-home:hover { background-color: #475569; }
.turn-indicator { font-size: 1.4rem; font-weight: bold; color: #ff9e00; margin-bottom: 15px; background: rgba(255, 158, 0, 0.1); padding: 8px; border-radius: 6px; border: 1px solid rgba(255, 158, 0, 0.3); }
.rank-badge { font-size: 1.8rem; color: #ff007f; font-weight: bold; text-shadow: 0 0 10px rgba(255, 0, 127, 0.6); }

/* --- 🌌 ネオンバーチャルキーボードの独自スタイル --- */
.keyboardcon {
    background: #0d1321;
    border: 2px solid rgba(0, 180, 216, 0.4);
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(0, 180, 216, 0.1);
    z-index: 999;
    width: 680px;
}
.keyboard-header {
    font-size: 0.85rem;
    color: #4ba3c3;
    background: #141c2f;
    padding: 6px;
    margin-bottom: 12px;
    border-radius: 6px;
    cursor: move;
    font-weight: bold;
    letter-spacing: 1px;
}
.keyboard-grid {
    display: grid;
    grid-template-columns: repeat(30, 20px);
    grid-gap: 6px;
    justify-content: center;
}
.keyboard {
    background: #182238;
    border: 1px solid #233252;
    color: #a0aec0;
    border-radius: 6px;
    height: 38px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 0.9rem;
    transition: all 0.08s ease;
    grid-column: span 2;
}
/* 特殊キーの幅調整 */
.keyboard.Shift { grid-column: span 3; }
.keyboard.Shift2 { grid-column: span 3; }
.keyboard.spaceKey { grid-column: span 12; grid-column-start: 10; height: 42px; margin-top: 2px; }

/* 🌟 アニメーション＆光るネオンステート */
.keyboard.pressed {
    background: var(--color-correct) !important;
    color: #000 !important;
    box-shadow: 0 0 15px var(--color-correct);
    transform: scale(0.92);
}
.keyboard.target {
    background: rgba(0, 180, 216, 0.3) !important;
    border-color: var(--color-primary) !important;
    color: #fff !important;
    box-shadow: 0 0 12px rgba(0, 180, 216, 0.8);
    animation: pulse-neon 0.6s infinite alternate;
}
@keyframes pulse-neon {
    0% { opacity: 0.7; box-shadow: 0 0 4px rgba(0, 180, 216, 0.4); }
    100% { opacity: 1; box-shadow: 0 0 15px rgba(0, 180, 216, 1); }
}

    </style>

        <div class="name-inputs">

        </div>
        <div id="vs-winner-display" style="font-size: 1.4rem; font-weight: bold; color: #e67e22; margin-bottom: 15px;" class="hidden"></div>
        <div style="display: flex; flex-direction: column; gap: 10px; max-width: 300px; margin: 0 auto;">
            <button id="restart-btn" class="btn">もう一度挑戦</button>
            <button id="home-btn" class="btn btn-home">ホームに戻る</button>
        </div>
    </div>
</div>

        audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

// ==========================================================

function parseKanaToRomanOptions(kanaStr) {
    let index = 0;
    const patternNodes = [];

    while (index < kanaStr.length) {
        let token = kanaStr.substr(index, 2);
        let match = romanTree[token];
        let length = 2;

        if (!match) {
            token = kanaStr.substr(index, 1);
            match = romanTree[token];
            length = 1;
        }

        // 小さい「つ（促音）」のパース処理
        if (token === 'っ') {
            const nextIndex = index + 1;
            if (nextIndex < kanaStr.length) {
                let nextToken = kanaStr.substr(nextIndex, 2);
                let nextMatch = romanTree[nextToken];
                let nextLen = 2;

                if (!nextMatch) {
                    nextToken = kanaStr.substr(nextIndex, 1);
                    nextMatch = romanTree[nextToken];
                    nextLen = 1;
                }

                if (nextMatch) {
                    const sokuonOptions = {};
                    Object.keys(nextMatch).forEach(k => {
                        if (k === 'default') return;
                        const r = nextMatch[k];
                        const firstChar = r.charAt(0);
                        sokuonOptions[firstChar + r] = firstChar + r;
                        sokuonOptions['xtu' + r] = 'xtu' + r;
                        sokuonOptions['ltu' + r] = 'ltu' + r;
                    });
                    
                    const defNext = nextMatch.default || Object.values(nextMatch);
                    sokuonOptions['default'] = defNext.charAt(0) + defNext;

                    patternNodes.push(sokuonOptions);
                    index += (1 + nextLen);
                    continue;
                }
            }
            match = {'default': 'xtu', 'xtu': 'xtu', 'ltu': 'ltu'};
        }

        // 【プロ仕様解決】「ん」の1回押し(n)・2回押し(nn)の両方を安全に自動判定
        if (token === 'ん') {
            const sokuonOptions = {};
            sokuonOptions['nn'] = 'nn';
            sokuonOptions['xn'] = 'xn';
            
            if (index + 1 < kanaStr.length) {
                let nextToken = kanaStr.substr(index + 1, 2);
                if (!romanTree[nextToken]) {
                    nextToken = kanaStr.substr(index + 1, 1);
                }
                const nextMatch = romanTree[nextToken];
                
                if (nextMatch) {
                    const isSpecialChar = Object.keys(nextMatch).some(k => {
                        if (k === 'default') return false;
                        return /^[aiueony]/.test(nextMatch[k]);
                    });
                    
                    // 次が母音・な行・や行以外なら、「n」単体ルートも同時に絶対に生かす設計
                    if (!isSpecialChar) {
                        sokuonOptions['n'] = 'n';
                    }
                } else {
                    sokuonOptions['n'] = 'n';
                }
            }
            
            sokuonOptions['default'] = 'nn';
            patternNodes.push(sokuonOptions);
            index += length;
            continue;
        }

        if (!match) {
            match = { 'default': token, [token]: token };
            length = 1;
        }

        const nodeData = {};
        Object.keys(match).forEach(k => {
            nodeData[k] = match[k];
        });
        
        patternNodes.push(nodeData);
        index += length;
    }
    return patternNodes;
}

        if (this.isVsMode) {
            turnText.classList.remove('hidden');
            turnText.textContent = this.currentTurn === 1 ? `🔥 ${this.p1Name} のターン` : `🔥 ${this.p2Name} のターン`;
        } else {
            turnText.classList.remove('hidden');
            turnText.textContent = `👤 ${this.p1Name} の挑戦`;
        }
        
        this.nextWord();
        this.startTimer();
    }

    nextWord() {
        const word = wordList[Math.floor(Math.random() * wordList.length)];
        document.getElementById('kanji').textContent = word.kanji;
        document.getElementById('kana').textContent = word.kana;
        
        this.nodes = parseKanaToRomanOptions(word.kana);
        this.nodeIndex = 0;
        this.currentInputted = "";
        this.displayRoman = this.nodes.map(n => n.default).join('');
        this.render();
    }

    render() {
        const area = document.getElementById('typing');
        area.innerHTML = '';
        
        let confirmedLength = 0;
        for(let i = 0; i < this.nodeIndex; i++) {
            const node = this.nodes[i];
            confirmedLength += (node.chosen || node.default).length;
        }
        confirmedLength += this.currentInputted.length;

        const fullText = this.displayRoman;
        for (let i = 0; i < fullText.length; i++) {
            const span = document.createElement('span');
            span.textContent = fullText[i];
            
            if (i < confirmedLength) {
                span.className = 'correct';
            } else if (i === confirmedLength) {
                span.className = 'current';
            } else {
                span.style.color = 'var(--text-muted)';
            }
            area.appendChild(span);
        }
    }
// ==========================================================
// 超本格タイピングゲーム メインロジック（typingjs.js） - 5/5 (手元キーボード完全連動版)
// ==========================================================

    handleInput(key) {
        if (!this.isPlaying || key.length > 1) return;
        const currentNode = this.nodes[this.nodeIndex];
        const attempt = this.currentInputted + key;
        
        // 有効なローマ字入力ルート候補をフィルタリング
        const validOptions = Object.keys(currentNode)
            .filter(k => k !== 'default' && k !== 'chosen')
            .map(k => currentNode[k])
            .filter(opt => opt.startsWith(attempt));

        // 物理キーボードのリアルタイムフラッシュ可視化
        const targetId = key === ' ' ? 'key-space' : `key-${key.toLowerCase()}`;
        const keyEl = document.getElementById(targetId);
        if (keyEl) {
            keyEl.classList.add('pressed');
            setTimeout(() => keyEl.classList.remove('pressed'), 80);
        }

        if (validOptions.length > 0) {
            this.correctCount++;
            this.currentInputted = attempt;
            playSound('type');
            document.getElementById('game-container').classList.remove('wrong-flash');
            
            const bestTarget = validOptions.find(opt => opt === attempt) || validOptions[0];
            const oldTarget = currentNode.chosen || currentNode.default;
            
            if(bestTarget !== oldTarget) {
                currentNode.chosen = bestTarget;
                let currentFullOptions = this.nodes.map((n, idx) => {
                    if (idx === this.nodeIndex) return bestTarget;
                    return n.chosen || n.default;
                });
                this.displayRoman = currentFullOptions.join('');
            }

            if (this.currentInputted === bestTarget) {
                currentNode.chosen = bestTarget;
                this.nodeIndex++;
                this.currentInputted = "";

                if (this.nodeIndex >= this.nodes.length) {
                    this.score += this.displayRoman.length * 10;
                    document.getElementById('score').textContent = this.score;
                    playSound('clear');
                    this.nextWord();
                    return;
                }
            }
            this.render();
            this.updateKeyboardNav(); // 次に打つべきキーのガイドを更新
        } else {
            this.missCount++;
            playSound('miss');
            const container = document.getElementById('game-container');
            container.classList.remove('wrong-flash');
            void container.offsetWidth; 
            container.classList.add('wrong-flash');
        }
    }

    // ⭐ 次に打つべきアルファベットキーをナビ点滅させる機能
    updateKeyboardNav() {
        // 一度すべてのナビ点滅スタイルをリセット
        document.querySelectorAll('.keyboard').forEach(el => el.classList.remove('target'));
        
        if (!this.isPlaying) return;
        
        // 全体の確定文字数から、次に打つべき1文字を特定する
        let confirmedLength = 0;
        for(let i = 0; i < this.nodeIndex; i++) {
            const node = this.nodes[i];
            confirmedLength += (node.chosen || node.default).length;
        }
        confirmedLength += this.currentInputted.length;
        
        const nextChar = this.displayRoman[confirmedLength];
        if (!nextChar) return;
        
        const targetId = nextChar === ' ' ? 'key-space' : `key-${nextChar.toLowerCase()}`;
        const targetEl = document.getElementById(targetId);
        if (targetEl) {
            targetEl.classList.add('target');
        }
        
        // 大文字だったり、特定の特殊記号の場合はShiftキーも同時にナビ点滅させる
        if (/[A-Z!@#\$%\^&\*\(\)_\+\{\}\|:\"<>?\?]/.test(nextChar)) {
            document.getElementById('key-shift-l').classList.add('target');
            document.getElementById('key-shift-r').classList.add('target');
        }
    }

    startTimer() {
        this.timer = setInterval(() => {
            this.timeLeft--;
            document.getElementById('time').textContent = this.timeLeft;
            if (this.timeLeft <= 0) this.endTurn();
        }, 1000);
    }

    endTurn() {
        clearInterval(this.timer);
        this.isPlaying = false;
        document.getElementById('draggable').classList.add('hidden'); // キーボード隠す
        this.updateKeyboardNav();
        
        if (this.isVsMode && this.currentTurn === 1) {
            this.p1Score = this.score;
            this.currentTurn = 2;
            alert(`⏱️ ${this.p1Name} のタイムアップ！\n次は ${this.p2Name} の番です。準備ができたらOKを押してください。`);
            this.startTurn();
        } else {
            this.showResult();
        }
    }

    getRankName(score) {
        const rank = typingRanks.find(r => score >= r.min);
        return rank ? rank.name : '【測定不能】';
    }

    showResult() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        const elapsedSeconds = 30; 
        const wpm = Math.round((this.correctCount / elapsedSeconds) * 60);
        const accuracy = this.correctCount > 0 ? Math.round((this.correctCount / (this.correctCount + this.missCount)) * 100) : 0;

        document.getElementById('res-score').textContent = this.score;
        document.getElementById('res-wpm').textContent = wpm;
        document.getElementById('res-total').textContent = this.correctCount;
        document.getElementById('res-miss').textContent = this.missCount;
        document.getElementById('res-accuracy').textContent = accuracy + "%";
        document.getElementById('res-rank').textContent = this.getRankName(this.score);

        const winnerDisplay = document.getElementById('vs-winner-display');
        if (this.isVsMode) {
            document.getElementById('result-title').textContent = "👑 対戦結果 👑";
            winnerDisplay.classList.remove('hidden');
            if (this.p1Score > this.score) {
                winnerDisplay.textContent = `🎉 勝者：${this.p1Name}！ (${this.p1Name}:${this.p1Score}点 / ${this.p2Name}:${this.score}点)`;
            } else if (this.score > this.p1Score) {
                winnerDisplay.textContent = `🎉 勝者：${this.p2Name}！ (${this.p1Name}:${this.p1Score}点 / ${this.p2Name}:${this.score}点)`;
            } else {
                winnerDisplay.textContent = `🤝 引き分け！ (${this.score}点 同点です！)`;
            }
        } else {
            document.getElementById('result-title').textContent = "スコア結果";
            winnerDisplay.add('hidden');
        }
    }

    goHome() {
        clearInterval(this.timer);
        this.isPlaying = false;
        document.getElementById('draggable').classList.add('hidden');
        this.updateKeyboardNav();
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }
}

const game = new TypingGame();
document.getElementById('start-solo-btn').addEventListener('click', () => game.initGame(false));
document.getElementById('start-vs-btn').addEventListener('click', () => game.initGame(true));
document.getElementById('restart-btn').addEventListener('click', () => game.initGame(game.isVsMode));
document.getElementById('home-btn').addEventListener('click', () => game.goHome());

window.addEventListener('keydown', (e) => {
    if (e.code === 'Escape') {
        e.preventDefault();
        game.goHome();
        return;
    }
    if (!game.isPlaying && e.code === 'Space') {
        e.preventDefault();
        if(document.getElementById('result-screen').classList.contains('hidden')) {
            game.initGame(false);
        } else {
            game.initGame(game.isVsMode);
        }
    } else if (game.isPlaying) {
        if(e.code === 'Space') e.preventDefault();
        game.handleInput(e.key);
    }
});

// ⭐ ゲームスタート時にキーボードを表示するラッパー処理を追加
const originalStartTurn = game.startTurn;
game.startTurn = function() {
    originalStartTurn.apply(this);
    document.getElementById('draggable').classList.remove('hidden');
    game.updateKeyboardNav();
};

// ⭐ キーボードのドラッグ＆ドロップ移動ロジックの実装
const dragEl = document.getElementById("draggable");
const handleEl = document.getElementById("drag-handle");
let isDragging = false; let offsetX = 0; let offsetY = 0;

handleEl.addEventListener("mousedown", (e) => {
    isDragging = true;
    offsetX = e.clientX - dragEl.getBoundingClientRect().left;
    offsetY = e.clientY - dragEl.getBoundingClientRect().top;
    dragEl.style.transform = "none"; // 初期中央配置用のtransformを解除
});
document.addEventListener("mousemove", (e) => {
    if (!isDragging) return;
    dragEl.style.left = (e.clientX - offsetX) + "px";
    dragEl.style.top = (e.clientY - offsetY) + "px";
});
document.addEventListener("mouseup", () => { isDragging = false; });
</script>
